[package]
name = "open-chess-review-desktop"
version = "0.1.0"
description = "Native shell for Open Chess Review"
authors = ["Open Chess Review contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "open_chess_review_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-shell = "2.3.3"
tauri-plugin-single-instance = "2.4.3"
