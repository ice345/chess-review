name: Desktop artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

jobs:
  build-desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64 app and DMG
            runner: macos-latest
            args: --target aarch64-apple-darwin --bundles app,dmg --no-sign
            artifact: desktop-macos-arm64
            paths: |
              apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
              apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows x64 NSIS
            runner: windows-latest
            args: --bundles nsis
            artifact: desktop-windows-x64
            paths: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          - name: Linux x64 deb and AppImage
            runner: ubuntu-22.04
            args: --bundles deb,appimage
            artifact: desktop-linux-x64
            paths: |
              apps/desktop/src-tauri/target/release/bundle/deb/*.deb
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage

    steps:
      - uses: actions/checkout@v6
      - name: Install Linux desktop dependencies
        if: startsWith(matrix.runner, 'ubuntu-')
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: pnpm/action-setup@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.runner, 'macos-') && 'aarch64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - name: Build packaged local-ai sidecar
        run: pnpm --filter @chess-review/desktop sidecar:build
      - name: Build Tauri bundles
        working-directory: apps/desktop
        run: pnpm tauri build --config src-tauri/tauri.sidecar.conf.json ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 14
