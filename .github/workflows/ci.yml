name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-quality:
    name: TypeScript, tests, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Check production dependency advisories
        run: pnpm audit --prod --audit-level high
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: python3 -m unittest discover -s deploy/nuc -p "test_*.py"
      - run: pnpm build
      - name: Verify the authored pieces reached both build outputs
        run: |
          node scripts/sync-piece-assets.mjs --check
          test "$(find apps/mobile/dist/assets -name '*.png' | wc -l)" -ge 12

  local-ai:
    name: Python local-ai tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install uv with dependency cache
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: services/local-ai/uv.lock
      - run: uv sync --project services/local-ai --extra dev --locked
      - run: uv run --project services/local-ai --extra dev pytest services/local-ai/tests

  mobile-host:
    name: Mobile Tauri host
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/mobile/src-tauri -> target
      - run: cargo test --locked --manifest-path apps/mobile/src-tauri/Cargo.toml

  browser-workflows:
    name: Browser workflow E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Browser workflow E2E
        run: |
          # Everything the default config covers, minus the two specs that depend on
          # artifacts of this repository's own machines: visual.spec.ts compares
          # against baselines generated on macOS, and review-second-cut-shot.spec.ts
          # is a capture tool that writes screenshots to /tmp. The release-only specs
          # are excluded by testIgnore and run against the standalone artifact below.
          # A hand-maintained allowlist is what let e2e/audit-cleanup.spec.ts and
          # e2e/zoom-acceptance.spec.ts fall out of CI; this filter cannot drift.
          pnpm exec playwright test "e2e/(?!visual|review-second-cut-shot).*\.spec\.ts"
      - name: Build public Browser Core
        run: pnpm build
        env:
          NEXT_PUBLIC_APP_MODE: browser-core
      - run: pnpm exec playwright test --config playwright.release.config.ts
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  nuc-container:
    name: NUC standalone container and proxy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Build Linux amd64 release
        run: deploy/nuc/build.sh chess-review:ci "$GITHUB_SHA"
      - name: Configure isolated local ingress
        run: |
          python3 deploy/nuc/release.py init
          python3 - <<'PYCONFIG'
          from pathlib import Path
          path = Path('deploy/nuc/.env')
          path.write_text(path.read_text().replace('DOMAIN=\n', 'DOMAIN=chess-ci.example.org\n').replace('LICHESS_CLIENT_ID=\n', 'LICHESS_CLIENT_ID=chess-ci.example.org\n'))
          PYCONFIG
      - name: Start and verify actual proxy without following OAuth redirect
        run: |
          python3 deploy/nuc/release.py deploy chess-review:ci
          python3 deploy/nuc/release.py check
          python3 deploy/nuc/smoke.py
      - name: Diagnostics on failure
        if: failure()
        run: |
          docker logs --tail 100 chess-review-web-1 || true
          docker logs --tail 100 chess-review-gateway-1 || true
